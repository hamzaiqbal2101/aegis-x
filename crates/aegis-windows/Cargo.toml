[package]
name = "aegis-windows"
version = "0.1.0"
edition = "2021"
description = "AEGIS X Windows adapter: policy-to-WFP translation plus the WFP engine installer (Windows-only; compile-checked via cross-target check, runtime unverified)"
license = "MIT OR Apache-2.0"

[dependencies]
aegis-core = { path = "../aegis-core" }

# Only used by the Windows engine implementation (cfg(windows)).
# On Linux this crate builds with a stub engine, no Windows deps.
# NOTE: Win32_Security is REQUIRED, not optional: nearly all WFP types
# (FWPM_FILTER0, FWP_VALUE0, FWP_CONDITION_VALUE0, ...) are cfg-gated
# on it in the windows crate. Without it the engine does not compile.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Security", "Win32_System_Rpc", "Win32_System_Services", "Win32_System_Threading"] }
sha2 = "0.10"

[[bin]]
name = "aegis-win"
path = "src/bin/aegis-win.rs"

[[bin]]
name = "aegis-service"
path = "src/bin/aegis-service.rs"
