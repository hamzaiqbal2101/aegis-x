[package]
name = "aegis-core"
version = "0.1.0"
edition = "2021"
description = "AEGIS X shared policy engine: policy model, matcher, conflict detection, integrity"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "policy_bench"
harness = false
