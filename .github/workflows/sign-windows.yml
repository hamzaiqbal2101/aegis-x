# AEGIS X — Windows release build + SignPath signing
#
# LIVE FILE: .github/workflows/sign-windows.yml (added Nov 14, 2026,
# commit 7c39f0b). This local copy is the source for future edits:
# the GitHub App cannot write workflow files, so an updated version
# goes in by hand (repo page -> Actions tab -> the workflow file ->
# edit, or "New workflow" for a fresh file). Keep the two in sync.
#
# WHAT STILL NEEDS FILLING IN (after SignPath approves the application):
#   - SIGNPATH_API_TOKEN: a repository secret, created at
#     Settings -> Secrets and variables -> Actions -> New repository secret.
#     The value comes from the SignPath portal after approval. Never paste it
#     into this file or into chat.
#   - vars / secrets below marked TODO-SIGNPATH: organization-id, project-slug
#     and signing-policy-slug all come from the SignPath portal after approval.
#   Until those exist, this workflow will fail at the signing step by design —
#   the MSI build steps above it should still succeed, which is a useful check.
#
# WHAT IT DOES:
#   On a published GitHub Release (tag like v0.1.0), it builds the MSI from the
#   exact tagged commit on a GitHub-hosted Windows runner, then sends the MSI
#   to SignPath for signing and uploads the signed MSI back to the release job.
#   No private key is ever stored in the repo; signing happens on SignPath's side.
#
# SUPPLY CHAIN (review Nov 14, 2026):
#   - Every `uses:` is pinned to a full commit SHA, not a moving tag:
#     a compromised tag could otherwise exfiltrate SIGNPATH_API_TOKEN
#     or tamper with the MSI before signing. The comment after each
#     SHA names the tag it was taken from (verify with
#     `git ls-remote <repo> refs/tags/<tag>`).
#   - The SignPath action is `signpath/github-action-submit-signing-request`
#     (v2.3). The earlier template used `signpath/github-action@v1` —
#     that repository DOES NOT EXIST (404), so the signing step would
#     have failed with "action not found" even after approval. The
#     step also passed the artifact NAME as `github-artifact-id`;
#     the action requires the numeric artifact id from the preceding
#     upload step's output (`steps.upload-unsigned.outputs.artifact-id`).
#   - WiX is pinned to 7.0.1 (was an unpinned `dotnet tool install`).
#   - The job has a 60-minute timeout (was the GitHub default 6 h).

name: Sign Windows MSI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-sign:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out tagged release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - name: Set up .NET SDK 8 (for the WiX tool)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Install WiX v7
        run: dotnet tool install --global wix --version 7.0.1

      - name: Accept WiX EULA
        run: wix eula accept wix7

      - name: Derive MSI version from release tag
        id: msi-version
        shell: pwsh
        run: |
          # Tag is like v0.1.0; the MSI version is the tag without the leading "v".
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "release tag '$tag' is not a vX.Y.Z tag; cannot derive an MSI version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build the MSI
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          .\packaging\windows\build-msi.ps1 -Version "${{ steps.msi-version.outputs.version }}"

      - name: Upload unsigned MSI as job artifact
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-x-msi-unsigned
          path: packaging/windows/aegis-x.msi

      # TODO-SIGNPATH: fill in the three values below from the SignPath portal
      # after the application is approved. Do not run a signed release before then.
      - name: Sign the MSI with SignPath
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: TODO-SIGNPATH-ORG-ID
          project-slug: TODO-SIGNPATH-PROJECT-SLUG
          signing-policy-slug: TODO-SIGNPATH-POLICY-SLUG
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          output-artifact-directory: signed-msi

      - name: Upload signed MSI as job artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aegis-x-msi-signed
          path: signed-msi/aegis-x.msi
